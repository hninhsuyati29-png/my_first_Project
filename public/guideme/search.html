<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search — UIT GuideMe</title>
  <meta name="description" content="Search UIT rooms by number, name, or department. Filter by lecture room, laboratory, office, or facility." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div data-nav></div>
  <main>
    <div class="page-head">
      <div class="container">
        <div class="crumbs"><a href="index.html">Home</a> · <span>Search</span></div>
        <span class="eyebrow">Find a room</span>
        <h1 style="margin:8px 0 6px;">Search the campus</h1>
        <p class="muted" style="max-width:640px;">Type a room number (e.g. <strong>213</strong>), a name (e.g. <strong>Programming Lab</strong>), or a department (e.g. <strong>Computer Science</strong>).</p>
        <form data-search-form class="search-wrap" style="margin-top:14px;max-width:720px;" role="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input data-search-input type="text" placeholder="Search rooms, labs, offices, departments…" aria-label="Search rooms" />
          <button class="btn btn-primary" type="submit">Search</button>
        </form>
        <div class="search-filters" data-search-chips></div>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <p class="muted" style="margin:0 0 14px;" data-search-summary></p>
        <div class="stack" data-search-results></div>
      </div>
    </section>
  </main>
  <div data-footer></div>

  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/search.js"></script>
  <script src="js/pages/search.js"></script>
</body>
</html>
